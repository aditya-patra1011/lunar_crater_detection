[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lunar-crater-detection"
dynamic = ["version"]
description = "Lunar crater detection from LRO/LOLA topography: data pipeline, models, evaluation and serving."
readme = "README.md"
requires-python = ">=3.11"
# Runtime dependencies are declared here, in the PR that first needs them.
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "rasterio>=1.4",
]

[project.optional-dependencies]
# Model training and the U-Net detector. Install the build that matches your hardware
# (CPU or CUDA) from pytorch.org; Colab already has one.
train = ["torch>=2.9"]
# Exporting the networks to ONNX.
export = ["torch>=2.9", "onnx>=1.23", "onnxscript>=0.7", "onnxruntime>=1.31"]
# The API. PyTorch is not needed.
serve = ["fastapi>=0.162", "uvicorn>=0.54", "python-multipart>=0.0.33", "onnxruntime>=1.31"]

[tool.setuptools.dynamic]
version = { attr = "lunar_crater.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"lunar_crater.serving" = ["static/*"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=lunar_crater --cov-report=term-missing"

[tool.coverage.run]
branch = true
