[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lunar-crater-detection"
dynamic = ["version"]
description = "Lunar crater detection from LRO/LOLA topography: data pipeline, models, evaluation and serving."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.dynamic]
version = { attr = "lunar_crater.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
